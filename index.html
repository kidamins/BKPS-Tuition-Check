<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คค่าเทอม · โรงเรียนบางแก้วประชาสรรค์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f5;--card:#fff;--ink:#3b2226;--mute:#957a7e;--line:#f7e1dd;--pri:#f2635f;--pri2:#ff9a8b;--pink:#ff7eb3;
--ok:#1f9d6e;--okbg:#dcf5ea;--part:#b87400;--partbg:#fff0cf;--due:#d63f55;--duebg:#ffe1e5;--sh:0 10px 30px -12px rgba(242,99,95,.35)}
@media(prefers-color-scheme:dark){:root{--bg:#231619;--card:#33211f;--ink:#ffeae6;--mute:#d1a8a6;--line:#4b2f31;--okbg:#1c3a30;--partbg:#4a3918;--duebg:#4a2227;--ok:#6fe0b0;--part:#ffc760;--due:#ff8e9c;--sh:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,"Noto Sans Thai",system-ui,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#E8761A,#E94F64 60%,#C13B9E);color:#fff;padding:max(28px,env(safe-area-inset-top)) 20px 90px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:260px;height:260px;right:-70px;top:-90px}.hero::after{width:150px;height:150px;left:-40px;bottom:-60px}
.hero-in{position:relative;max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center}
.logo{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;padding:4px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hero h1{margin:0;font-size:1.35rem;font-weight:700;line-height:1.25}.hero p{margin:2px 0 0;font-size:.88rem;opacity:.92}
main{max-width:760px;margin:-62px auto 0;padding:0 16px 60px;position:relative}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
form{display:grid;gap:12px}
.fld{display:block}.fld span{display:block;font-size:.85rem;color:var(--mute);margin:0 0 4px 4px}
input,select{width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:1rem}
input:focus{border-color:var(--pri2);background:var(--card)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pink));color:#fff;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;font-weight:600;font-size:1rem;box-shadow:0 8px 18px -8px var(--pri)}
.btn:disabled{opacity:.6}.btn.ghost{background:var(--card);color:var(--pri);box-shadow:none;border:1.5px solid var(--line)}
.err{color:var(--due);min-height:1.3em;margin:8px 4px 0;font-size:.92rem}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.paid{background:var(--okbg);color:var(--ok)}.partial{background:var(--partbg);color:var(--part)}.unpaid{background:var(--duebg);color:var(--due)}
.hint{color:var(--mute);font-size:.88rem}
/* parent */
.me{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:url(#g);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:1.6rem;line-height:1}.ring small{color:var(--mute);font-size:.75rem}
.me h2{margin:0;font-size:1.25rem}.big{font-size:2rem;font-weight:700;line-height:1.2;color:var(--due)}.big.ok{color:var(--ok)}
.yr{margin:20px 4px 8px;font-weight:600}
.term{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:18px;background:var(--bg);margin-bottom:8px}
.term small{color:var(--mute)}.term .r{text-align:right}
.mini{grid-column:1/-1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#6fe0b0)}
/* staff */
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:18px;padding:14px;background:var(--bg)}.tile small{color:var(--mute);display:block}.tile b{font-size:1.35rem}
.tile.wide{grid-column:1/-1;background:linear-gradient(135deg,var(--pri),var(--pink));color:#fff}.tile.wide small{color:rgba(255,255,255,.85)}.tile.wide b{font-size:1.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters .fld:first-child{grid-column:1/-1}
.list{margin-top:6px}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.item:hover{background:var(--bg)}.item:last-child{border:0}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:600;color:#fff}
.item .m{flex:1;min-width:0}.item .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right}.item .r b{display:block;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:26px;padding:22px;max-width:460px;width:92%;background:var(--card);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(59,34,38,.5);backdrop-filter:blur(3px)}

#login{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(170deg,#E8761A 0%,#E94F64 55%,#C13B9E 100%);color:#fff;display:flex;padding:max(28px,env(safe-area-inset-top)) 24px 28px}
#login[hidden]{display:none}
.lg{width:100%;max-width:360px;margin:auto;text-align:center}
.badge{width:124px;height:124px;border-radius:50%;background:#fff;margin:0 auto 16px;display:grid;place-items:center;padding:6px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.badge img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.lg h1{margin:0;font-size:1.35rem;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.lg .sub{margin:2px 0 20px;font-size:.95rem}
.seg{display:grid;grid-template-columns:1fr 1fr;position:relative;background:rgba(255,255,255,.22);border-radius:99px;padding:4px;margin-bottom:18px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:99px;transition:transform .25s;box-shadow:0 4px 10px -4px rgba(0,0,0,.3)}
.seg.two i{transform:translateX(100%)}
.seg button{position:relative;background:none;border:0;padding:10px;font-weight:500;color:#fff;cursor:pointer;border-radius:99px}
.seg button[aria-selected=true]{color:#B6340F;font-weight:600}
.lg form{gap:14px;text-align:left}
.pill{position:relative;display:block}
.pill svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:#E8761A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill input{background:rgba(255,255,255,.96);color:#3b2226;border-radius:99px;padding:14px 18px 14px 52px;border:2px solid transparent}
.pill input:focus{border-color:#FFD21F;background:#fff}
.rem{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer;padding-left:6px}
.rem input{width:18px;height:18px;padding:0;accent-color:#FFD21F}
.go{background:#FFD21F;color:#4a2b0a;border:0;border-radius:99px;padding:14px;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 12px 22px -10px rgba(0,0,0,.45)}
.go:disabled{opacity:.7}
#login .err{color:#fff;background:rgba(0,0,0,.25);border-radius:14px;padding:9px 14px;margin:14px 0 0}
#login .err:empty{display:none}
.help{margin:22px 0 0;font-size:.88rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:420px){.bento{grid-template-columns:1fr 1fr}.ring{margin:0 auto}}
</style>
</head>
<body>
<div class="hero"><div class="hero-in">
  <div class="logo"><img class="lgimg" alt="ตราโรงเรียนบางแก้วประชาสรรค์"></div>
  <div><h1>เช็คค่าเทอมนักเรียน</h1><p>โรงเรียนบางแก้วประชาสรรค์</p></div>
</div></div>

<main>
<section id="login"><div class="lg">
  <div class="badge"><img class="lgimg" alt="ตราโรงเรียนบางแก้วประชาสรรค์"></div>
  <h1>โรงเรียนบางแก้วประชาสรรค์</h1><p class="sub">ตรวจสอบค่าเทอมนักเรียน</p>
  <div class="seg" id="seg" role="tablist"><i></i>
    <button type="button" role="tab" id="t1" aria-selected="true">ผู้ปกครอง</button>
    <button type="button" role="tab" id="t2" aria-selected="false">เจ้าหน้าที่</button></div>
  <form id="f1">
    <label class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><input id="sid" inputmode="numeric" autocomplete="off" placeholder="รหัสนักเรียน" aria-label="รหัสนักเรียน" required></label>
    <label class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN 4 หลัก" aria-label="PIN 4 หลัก" required></label>
    <label class="rem"><input type="checkbox" id="rem"> จำรหัสนักเรียนไว้ในเครื่องนี้</label>
    <button class="go">ดูยอดค่าเทอม</button></form>
  <form id="f2" hidden>
    <label class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" placeholder="รหัสผ่านเจ้าหน้าที่" aria-label="รหัสผ่านเจ้าหน้าที่" required></label>
    <button class="go">เข้าสู่ระบบ</button></form>
  <p class="err" id="err" role="alert"></p>
  <p class="help">ลืม PIN? ติดต่อฝ่ายการเงินของโรงเรียน</p>
</div></section>

<section id="parent" hidden></section>

<section id="staff" hidden>
  <div class="card"><div class="bento" id="stats"></div></div>
  <div class="card">
    <div class="filters">
      <label class="fld"><span>ค้นหา</span><input type="search" id="q" placeholder="รหัสหรือชื่อนักเรียน"></label>
      <label class="fld"><span>ภาคเรียน</span><select id="per"></select></label>
      <label class="fld"><span>ชั้น</span><select id="cls"></select></label>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-s="" aria-pressed="true">ทั้งหมด</button><button class="chip" data-s="unpaid" aria-pressed="false">ยังไม่ชำระ</button>
      <button class="chip" data-s="partial" aria-pressed="false">ชำระบางส่วน</button><button class="chip" data-s="paid" aria-pressed="false">ชำระครบ</button></div>
    <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="hint" id="count"></span><button class="btn ghost" id="exp">ส่งออกรายชื่อที่ค้าง</button></div>
    <div class="list" id="list"></div>
  </div>
</section>
<p style="text-align:center"><button class="btn ghost" id="out" hidden>ออกจากระบบ</button></p>
</main>
<dialog id="dlg"></dialog>

const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(body){
  if(API.startsWith("PASTE"))return{ok:false,error:"ยังไม่ได้ใส่ลิงก์ Web App ในไฟล์"};
  try{const r=await fetch(API,{method:"POST",body:JSON.stringify(body)});return await r.json()}
  catch{return{ok:false,error:"เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"}}}
function tab(n){$("seg").classList.toggle("two",n==2);$("t1").setAttribute("aria-selected",n==1);$("t2").setAttribute("aria-selected",n==2);$("f1").hidden=n!=1;$("f2").hidden=n!=2;$("err").textContent=""}
try{const v=localStorage.getItem("sid");if(v){$("sid").value=v;$("rem").checked=true}}catch{}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);

async function submit(e,body,after){e.preventDefault();const b=e.target.querySelector("button"),t=b.textContent;b.disabled=true;b.textContent="กำลังตรวจสอบ...";
  const r=await api(body);b.disabled=false;b.textContent=t;
  if(!r.ok){$("err").textContent=r.error;return}
  ROWS=r.rows;$("login").hidden=true;$("out").hidden=false;after()}
$("f1").onsubmit=e=>submit(e,{action:"student",id:$("sid").value.trim(),pin:$("pin").value.trim()},()=>{try{$("rem").checked?localStorage.setItem("sid",$("sid").value.trim()):localStorage.removeItem("sid")}catch{}showParent()});
$("f2").onsubmit=e=>submit(e,{action:"staff",password:$("pw").value},showStaff);
$("out").onclick=()=>{ROWS=[];$("pin").value=$("pw").value="";$("parent").hidden=$("staff").hidden=$("out").hidden=true;$("login").hidden=false;window.scrollTo(0,0)};

/* ผู้ปกครอง */
function showParent(){
  if(!ROWS.length){$("parent").innerHTML='<div class="card">ไม่พบข้อมูลค่าเทอมของนักเรียนคนนี้ กรุณาติดต่อฝ่ายการเงิน</div>';$("parent").hidden=false;return}
  const s=ROWS[0],total=ROWS.reduce((a,r)=>a+r.edu+r.assoc,0),due=ROWS.reduce((a,r)=>a+r.due,0),pct=total?Math.round((total-due)/total*100):0,C=2*Math.PI*52;
  let html=`<div class="card"><div class="me">
   <div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><defs><linearGradient id="g"><stop offset="0" stop-color="#ff7eb3"/><stop offset="1" stop-color="#f2635f"/></linearGradient></defs>
    <circle class="bg" cx="64" cy="64" r="52"/><circle class="fg" id="fg" cx="64" cy="64" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
    <div><b>${pct}%</b><small>ชำระแล้ว</small></div></div>
   <div><h2>${esc(s.name)}</h2><span class="hint">รหัส ${esc(s.id)} · ชั้น ${esc(s.cls)}</span>
    <div class="hint" style="margin-top:10px">ยอดค้างชำระรวม</div><div class="big ${due<=0?"ok":""}">${due<=0?"ไม่มียอดค้าง":fmt(due)+" บาท"}</div></div></div></div>`;
  const years=[...new Set(ROWS.map(r=>r.year))].sort().reverse();
  years.forEach(y=>{html+=`<div class="yr">ปีการศึกษา ${esc(y)}</div>`;
   ROWS.filter(r=>r.year===y).sort(bySort).forEach(r=>{const t=r.edu+r.assoc,p=t?Math.round((t-r.due)/t*100):0,st=status(r.due,t);
    html+=`<div class="term"><b>ภาคเรียนที่ ${esc(r.term)}</b><span class="r"><span class="tag ${st}">${LABEL[st]}</span></span>
     <small>บำรุงการศึกษา ${fmt(r.edu)} · บำรุงสมาคม ${fmt(r.assoc)}</small><span class="r"><b>${r.due>0?"ค้าง "+fmt(r.due):"ครบแล้ว"}</b></span>
     <div class="mini"><i style="width:${p}%"></i></div></div>`})});
  $("parent").innerHTML=html;$("parent").hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("fg").style.strokeDashoffset=C*(1-pct/100)}))}

/* เจ้าหน้าที่ */
let groups=[];
function showStaff(){
  const per=[...new Set(ROWS.map(r=>r.year+"/"+r.term))].sort().reverse();
  $("per").innerHTML='<option value="">รวมทุกภาคเรียน</option>'+per.map(p=>`<option>${p}</option>`).join("");
  const cls=[...new Set(ROWS.map(r=>r.cls))].sort((a,b)=>a.localeCompare(b,"th",{numeric:true}));
  $("cls").innerHTML='<option value="">ทุกชั้น</option>'+cls.map(c=>`<option>${esc(c)}</option>`).join("");
  $("staff").hidden=false;render()}
function group(){const p=$("per").value,m=new Map();
  ROWS.filter(r=>!p||r.year+"/"+r.term===p).forEach(r=>{let g=m.get(r.id);if(!g)m.set(r.id,g={id:r.id,name:r.name,cls:r.cls,total:0,due:0});g.total+=r.edu+r.assoc;g.due+=r.due;g.cls=r.cls});
  return[...m.values()].map(g=>({...g,st:status(g.due,g.total)}))}
function render(){groups=group();
  const q=$("q").value.trim().toLowerCase(),c=$("cls").value;
  const f=groups.filter(g=>(!q||g.id.toLowerCase().includes(q)||g.name.toLowerCase().includes(q))&&(!c||g.cls===c)&&(!ST||g.st===ST));
  const n=k=>groups.filter(g=>g.st===k).length;
  $("stats").innerHTML=`<div class="tile wide"><small>ยอดค้างชำระรวม</small><b>${fmt(groups.reduce((a,g)=>a+g.due,0))} บาท</b></div>`+
   [["ชำระครบ","paid"],["ชำระบางส่วน","partial"],["ยังไม่ชำระ","unpaid"]].map(([l,k])=>`<div class="tile"><small>${l}</small><b>${fmt(n(k))}</b> <small style="display:inline">คน</small></div>`).join("");
  $("count").textContent=`พบ ${fmt(f.length)} จาก ${fmt(groups.length)} คน`+(f.length>100?" · แสดง 100 แรก":"");
  $("list").innerHTML=f.slice(0,100).map(g=>`<div class="item" tabindex="0" data-id="${esc(g.id)}"><div class="av" style="background:${color(g.name)}">${esc([...g.name.replace(/^(เด็กชาย|เด็กหญิง|นาย|นางสาว|ด\.ช\.|ด\.ญ\.)\s*/,"")][0]||"?")}</div>
   <div class="m"><b>${esc(g.name)}</b><span class="hint">${esc(g.id)} · ${esc(g.cls)}</span></div>
   <div class="r"><b>${g.due>0?fmt(g.due):"–"}</b><span class="tag ${g.st}">${LABEL[g.st]}</span></div></div>`).join("")||'<p class="hint" style="text-align:center;padding:24px 0">ไม่พบนักเรียนที่ตรงกับการค้นหา</p>'}
["q","per","cls"].forEach(i=>$(i).addEventListener("input",render));
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;ST=b.dataset.s;[...$("chips").children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()});
function open_(e){const it=e.target.closest(".item");if(!it)return;if(e.type=="keydown"&&e.key!="Enter")return;
  const rs=ROWS.filter(r=>r.id===it.dataset.id).sort(bySort),s=rs[0];
  $("dlg").innerHTML=`<h2 style="margin:0">${esc(s.name)}</h2><span class="hint">รหัส ${esc(s.id)} · ${esc(s.cls)}</span><div style="margin-top:12px">`+
   rs.map(r=>{const t=r.edu+r.assoc,st=status(r.due,t);return`<div class="term"><b>${esc(r.year)} ภาคเรียนที่ ${esc(r.term)}</b><span class="r"><span class="tag ${st}">${LABEL[st]}</span></span><small>การศึกษา ${fmt(r.edu)} · สมาคม ${fmt(r.assoc)}</small><span class="r"><b>${r.due>0?"ค้าง "+fmt(r.due):"ครบแล้ว"}</b></span></div>`}).join("")+
   '</div><button class="btn" style="width:100%;margin-top:6px" onclick="dlg.close()">ปิด</button>';$("dlg").showModal()}
$("list").addEventListener("click",open_);$("list").addEventListener("keydown",open_);
$("exp").onclick=()=>{const f=groups.filter(g=>g.due>0);
  const csv="\uFEFFรหัส,ชื่อ-สกุล,ชั้น,ค้างชำระ\n"+f.map(g=>[g.id,'"'+g.name+'"',g.cls,g.due].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ค้างชำระ.csv";a.click()};
</script>
</body>
</html>
