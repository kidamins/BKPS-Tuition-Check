<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f5;--card:#fff;--ink:#3b2226;--mute:#957a7e;--line:#f7e1dd;--pri:#f2635f;--pri2:#ff9a8b;--pink:#ff7eb3;
--ok:#1f9d6e;--okbg:#dcf5ea;--part:#b87400;--partbg:#fff0cf;--due:#d63f55;--duebg:#ffe1e5;--sh:0 10px 30px -12px rgba(242,99,95,.35)}
@media(prefers-color-scheme:dark){:root{--bg:#231619;--card:#33211f;--ink:#ffeae6;--mute:#d1a8a6;--line:#4b2f31;--okbg:#1c3a30;--partbg:#4a3918;--duebg:#4a2227;--ok:#6fe0b0;--part:#ffc760;--due:#ff8e9c;--sh:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,"Noto Sans Thai",system-ui,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#E8761A,#E94F64 60%,#C13B9E);color:#fff;padding:max(28px,env(safe-area-inset-top)) 20px 90px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:260px;height:260px;right:-70px;top:-90px}.hero::after{width:150px;height:150px;left:-40px;bottom:-60px}
.hero-in{position:relative;max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center}
.logo{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;padding:4px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hero h1{margin:0;font-size:1.35rem;font-weight:700;line-height:1.25}.hero p{margin:2px 0 0;font-size:.88rem;opacity:.92}
main{max-width:760px;margin:-62px auto 0;padding:0 16px 60px;position:relative}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
form{display:grid;gap:12px}
.fld{display:block}.fld span{display:block;font-size:.85rem;color:var(--mute);margin:0 0 4px 4px}
input,select{width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:1rem}
input:focus{border-color:var(--pri2);background:var(--card)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pink));color:#fff;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;font-weight:600;font-size:1rem;box-shadow:0 8px 18px -8px var(--pri)}
.btn:disabled{opacity:.6}.btn.ghost{background:var(--card);color:var(--pri);box-shadow:none;border:1.5px solid var(--line)}
.err{color:var(--due);min-height:1.3em;margin:8px 4px 0;font-size:.92rem}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.paid{background:var(--okbg);color:var(--ok)}.partial{background:var(--partbg);color:var(--part)}.unpaid{background:var(--duebg);color:var(--due)}
.hint{color:var(--mute);font-size:.88rem}
/* parent */
.me{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:url(#g);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:1.6rem;line-height:1}.ring small{color:var(--mute);font-size:.75rem}
.me h2{margin:0;font-size:1.25rem}.big{font-size:2rem;font-weight:700;line-height:1.2;color:var(--due)}.big.ok{color:var(--ok)}
.yr{margin:20px 4px 8px;font-weight:600}
.term{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:18px;background:var(--bg);margin-bottom:8px}
.term small{color:var(--mute)}.term .r{text-align:right}
.mini{grid-column:1/-1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#6fe0b0)}
/* staff */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:18px;padding:14px;background:var(--bg)}.tile small{color:var(--mute);display:block}.tile b{font-size:1.35rem}
.tile.wide{grid-column:1/-1;background:linear-gradient(135deg,var(--pri),var(--pink));color:#fff}.tile.wide small{color:rgba(255,255,255,.85)}.tile.wide b{font-size:1.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.filters .fld:first-child{grid-column:1/-1}
.list{margin-top:6px}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.item:hover{background:var(--bg)}.item:last-child{border:0}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:600;color:#fff}
.item .m{flex:1;min-width:0}.item .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right}.item .r b{display:block;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:26px;padding:22px;max-width:460px;width:92%;background:var(--card);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(59,34,38,.5);backdrop-filter:blur(3px)}

#login{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(170deg,#E8761A 0%,#E94F64 55%,#C13B9E 100%);color:#fff;display:flex;padding:max(28px,env(safe-area-inset-top)) 24px 28px}
#login[hidden]{display:none}
.lg{width:100%;max-width:360px;margin:auto;text-align:center}
.badge{width:124px;height:124px;border-radius:50%;background:#fff;margin:0 auto 16px;display:grid;place-items:center;padding:6px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.badge img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}

async function api(body){
  if(API.startsWith("PASTE"))return{ok:false,error:"ยังไม่ได้ใส่ลิงก์ Web App ในไฟล์"};
  try{const r=await fetch(API,{method:"POST",body:JSON.stringify(body)});return await r.json()}
  catch{return{ok:false,error:"เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"}}}
function tab(n){$("seg").querySelector("i").style.transform=`translateX(${(n-1)*100}%)`;
  [1,2,3].forEach(i=>{$("t"+i).setAttribute("aria-selected",i==n);$("f"+i).hidden=i!=n});$("err").textContent=""}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);$("t3").onclick=()=>tab(3);

function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("อ่านรูปไม่ได้"));
  fr.onload=()=>{const img=new Image();img.onload=()=>{try{const M=1400,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.78);res(u.length>2000000?null:u)}catch(e){res(fr.result)}};img.onerror=()=>res(fr.result);img.src=fr.result};
  fr.readAsDataURL(file)}).then(u=>{if(!u||u.length>2100000)throw new Error("รูปใหญ่เกินไป ลองถ่ายใหม่หรือย่อรูป");return u})}

  $("q_x").onclick=()=>$("dlg").close();
  $("af").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector(".btn:not(.ghost)");b.disabled=true;b.textContent="กำลังบันทึก...";
    const res=await api({action:"claimApprove",code:STAFFPW,n:c.n,edu:+$("q_e").value||0,assoc:+$("q_a").value||0,receiptEdu:$("q_re").value.trim(),receiptAssoc:$("q_ra").value.trim()});
    b.disabled=false;b.textContent="ยืนยัน";if(!res.ok){$("q_err").textContent=res.error;return}
    ROWS=ROWS.filter(r=>r.id!==c.id).concat(res.rows);$("dlg").close();renderClaims()};
  if(!$("dlg").open)$("dlg").showModal()}
$("claimwrap").addEventListener("click",async e=>{
  const bt=e.target.closest("button");if(!bt||!bt.dataset.n)return;const n=+bt.dataset.n,c=QCLAIMS.find(x=>x.n===n);
  if(bt.classList.contains("qv")){bt.disabled=true;bt.textContent="กำลังโหลดรูป...";const res=await api({action:"claimImage",code:STAFFPW,n});bt.disabled=false;bt.textContent="ดูรูปหลักฐาน";
    $("ci"+n).innerHTML=res.ok?`<img class="cimg" alt="รูปหลักฐาน" src="${res.image}">`:`<p class="err">${esc(res.error)}</p>`}
  if(bt.classList.contains("qa"))approveForm(c);
  if(bt.classList.contains("qr")){const reason=(prompt("เหตุผลที่ไม่ผ่าน (ผู้ปกครองจะเห็นข้อความนี้)")||"").trim();if(!reason)return;
    const res=await api({action:"claimReject",code:STAFFPW,n,reason});if(!res.ok){alert(res.error);return}renderClaims()}});
/* จัดการนักเรียน (ผู้พัฒนาระบบ) */
let MGMSG="";
const TERMS=["2567/1","2567/2","2568/1","2568/2","2569/1","2569/2","2570/1","2570/2","2571/1","2571/2"];
function renderManage(){
  const w=$("mgwrap"),cur=curTerm(),opt=(list,sel)=>list.map(t=>`<option${t===sel?" selected":""}>${t}</option>`).join("");
  w.innerHTML=(MGMSG?`<p class="warn" style="background:var(--okbg);color:var(--ok)">${esc(MGMSG)}</p>`:"")+`<p class="hint">ใช้เมื่อมีนักเรียนย้ายเข้าหรือย้ายออก มีผลกับชีตทันที</p>
  <div class="sh">ย้ายเข้า (เพิ่มนักเรียนใหม่)</div>
  <form id="addf" class="mgf"><label class="fld"><span>รหัสนักเรียน</span><input id="a_id" inputmode="numeric" autocomplete="off" required></label>
   <label class="fld"><span>ชื่อ-สกุล (รวมคำนำหน้า)</span><input id="a_name" autocomplete="off" required></label>
   <div class="two"><label class="fld"><span>ชั้น</span><select id="a_lv" required><option value="">เลือก</option>${[1,2,3,4,5,6].map(i=>`<option value="${i}">ม.${i}</option>`).join("")}</select></label>
   <label class="fld"><span>ห้อง</span><select id="a_rm" required disabled><option value="">เลือก</option></select></label></div>
   <label class="fld"><span>เริ่มเรียนภาคเรียน</span><select id="a_st">${opt(TERMS.slice(4),cur)}</select></label>
   <label class="fld"><span>วันเกิด ววดดปปปป พ.ศ. (เว้นว่าง = สร้าง PIN สุ่มให้)</span><input id="a_bd" inputmode="numeric" autocomplete="off"></label>
   <button class="btn">เพิ่มนักเรียน</button></form>
  <div class="sh">ย้ายออก</div>
  <form id="rmf" class="mgf"><label class="fld"><span>รหัสนักเรียน</span><input id="r_id" inputmode="numeric" autocomplete="off" required></label>
   <p class="hint" id="r_info" style="margin:0">พิมพ์รหัสเพื่อตรวจชื่อ</p>
   <label class="fld"><span>ภาคเรียนสุดท้ายที่ยังเรียนอยู่ (ภาคเรียนหลังจากนี้จะถูกซ่อน)</span><select id="r_last">${opt(TERMS,cur)}</select></label>
   <button class="btn">ย้ายออก</button></form>
  <p class="err" id="mgerr" role="alert"></p>`;
  MGMSG="";
  $("a_lv").onchange=()=>{const n=ROOMS[$("a_lv").value]||0;$("a_rm").innerHTML='<option value="">เลือก</option>'+Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");$("a_rm").disabled=!n};
  $("r_id").oninput=()=>{const id=$("r_id").value.trim(),s=ROWS.filter(r=>r.id===id).sort((a,b)=>(b.year+b.term).localeCompare(a.year+a.term))[0];$("r_info").textContent=s?`${s.name} · ${s.cls}`:(id?"ไม่พบรหัสนี้":"พิมพ์รหัสเพื่อตรวจชื่อ")};
  $("addf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");
   const p={action:"add"+"Student",code:STAFFPW,id:$("a_id").value.trim(),name:$("a_name").value.trim(),room:`ม.${$("a_lv").value}/${$("a_rm").value}`,start:$("a_st").value,birth:$("a_bd").value.trim()};
   if(!confirm(`เพิ่มนักเรียน ${p.name} (${p.id}) ห้อง ${p.room} เริ่ม ${p.start} ใช่ไหม`))return;
   b.disabled=true;b.textContent="กำลังบันทึก...";const res=await api(p);b.disabled=false;b.textContent="เพิ่มนักเรียน";
   if(!res.ok){$("mgerr").textContent=res.error;return}
   if(res.rows)ROWS=res.rows;MGMSG=res.message;render()};
  $("rmf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button"),id=$("r_id").value.trim(),s=ROWS.find(r=>r.id===id);
   if(!s){$("mgerr").textContent="ไม่พบรหัสนักเรียนนี้";return}
   if(!confirm(`ย้ายออก ${s.name} (${id}) ภาคเรียนสุดท้าย ${$("r_last").value} ใช่ไหม ภาคเรียนหลังจากนี้จะถูกซ่อน`))return;
   b.disabled=true;b.textContent="กำลังบันทึก...";const res=await api({action:"removeStudent",code:STAFFPW,id,last:$("r_last").value});b.disabled=false;b.textContent="ย้ายออก";
   if(!res.ok){$("mgerr").textContent=res.error;return}
   if(res.rows)ROWS=res.rows;MGMSG=res.message;render()};
}
/* ข้อความสำหรับคัดลอก */
function plabel(){const p=$("per").value;if(!p)return"ทุกภาคเรียน";const[y,t]=p.split("/");return`ภาคเรียนที่ ${t}/${y}`}
function roomMsg(room){
  const all=groups.filter(g=>g.cls===room),f=all.filter(g=>g.due>0).sort((a,b)=>a.id.localeCompare(b.id,"th",{numeric:true}));
  const head=`แจ้งรายชื่อนักเรียนค้างชำระค่าเทอม\n${SCHOOL}\nชั้น ${room} · ${plabel()}\n`;
  if(!f.length)return head+"ไม่มีนักเรียนค้างชำระ ขอบคุณค่ะ";
  return head+`ค้างชำระ ${fmt(f.length)} คน จากทั้งหมด ${fmt(all.length)} คน\n\n`+f.map((g,i)=>`${i+1}. ${g.name} (${g.id}) ค้าง ${fmt(g.due)} บาท`).join("\n")+`\n\nรวมค้างชำระ ${fmt(f.reduce((a,g)=>a+g.due,0))} บาท\n\nรบกวนครูที่ปรึกษาแจ้งผู้ปกครองเป็นรายบุคคล ขอบคุณค่ะ`}
function studentMsg(id){
  const p=$("per").value,rs=ROWS.filter(r=>r.id===id&&r.due>0&&(!p||r.year+"/"+r.term===p)).sort((a,b)=>(a.year+a.term).localeCompare(b.year+b.term));
  const s=ROWS.find(r=>r.id===id);
  const lines=rs.map(r=>`• ภาคเรียนที่ ${r.term}/${r.year}: `+[r.dueEdu>0?`บำรุงการศึกษา ${fmt(r.dueEdu)} บาท`:"",r.dueAssoc>0?`บำรุงสมาคม ${fmt(r.dueAssoc)} บาท`:""].filter(Boolean).join(" + "));
  return`เรียน ผู้ปกครองของ ${s.name} ชั้น ${rs.length?rs[rs.length-1].cls:s.cls}\n${SCHOOL}ขอแจ้งยอดค่าเทอมที่ค้างชำระ\n${lines.join("\n")}\nรวมทั้งสิ้น ${fmt(rs.reduce((a,r)=>a+r.due,0))} บาท\n\nขอความอนุเคราะห์ชำระที่ฝ่ายการเงินของโรงเรียน หากชำระแล้วขออภัย และโปรดแจ้งครูที่ปรึกษา ขอบคุณค่ะ`}
function showMsg(title,text,hint,back){
  $("dlg").innerHTML=`<h2 style="margin:0;font-size:1.15rem">${esc(title)}</h2><p class="warn">${esc(hint)}</p><textarea id="mt" rows="13">${esc(text)}</textarea>
  <div style="display:flex;gap:10px;margin-top:10px"><button class="btn ghost" id="bk" style="flex:1">${back?"กลับ":"ปิด"}</button><button class="btn" id="cp" style="flex:1">คัดลอก</button></div>`;
  $("bk").onclick=()=>back?detail(back):$("dlg").close();
  $("cp").onclick=async()=>{const v=$("mt").value;try{await navigator.clipboard.writeText(v)}catch{$("mt").select();document.execCommand("copy")}$("cp").textContent="คัดลอกแล้ว ✓"};
  if(!$("dlg").open)$("dlg").showModal()}
["q","per","cls"].forEach(i=>$(i).addEventListener("input",()=>{LIMIT=100;render()}));
$("morebtn").onclick=()=>{LIMIT+=100;render()};
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;ST=b.dataset.s;LIMIT=100;[...$("chips").children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()});
let STAFFPW="",CANPAY=false,CANMANAGE=false,ROOMONLY=false,USER=null,PARENT=null,CLAIMS=[];
function detail(id,msg){
  const rs=ROWS.filter(r=>r.id===id).sort(bySort),s=rs[0];$("dlg").dataset.id=id;
  $("dlg").innerHTML=`<h2 style="margin:0">${esc(s.name)}</h2><span class="hint">รหัส ${esc(s.id)} · ${esc(s.cls)}</span>`+
   (msg?`<p style="background:var(--okbg);color:var(--ok);border-radius:12px;padding:8px 12px;margin:10px 0 0">${esc(msg)}</p>`:"")+'<div style="margin-top:12px">'+
   rs.map(r=>{const t=r.edu+r.assoc,st=status(r.due,t);return`<div class="term"><b>${esc(r.year)} ภาคเรียนที่ ${esc(r.term)}</b><span class="r"><span class="tag ${st}">${LABEL[st]}</span></span><small>การศึกษา ${fmt(r.edu)} · สมาคม ${fmt(r.assoc)} · จ่ายแล้ว ${fmt(r.paid)}</small><span class="r"><b>${r.due>0?"ค้าง "+fmt(r.due):"ครบแล้ว"}</b></span>`+
    (r.due>0&&CANPAY?`<div style="grid-column:1/-1;text-align:right"><button class="btn ghost pay" data-y="${esc(r.year)}" data-t="${esc(r.term)}" style="padding:6px 14px">บันทึกการชำระ</button></div>`:"")+'</div>'}).join("")+
   '</div><div class="sh" style="margin-top:14px">ประวัติการชำระ</div><div id="hist" class="hint">กำลังโหลด...</div>'+(rs.some(r=>r.due>0&&(!$("per").value||r.year+"/"+r.term===$("per").value))?'<button class="btn ghost msgs" style="width:100%;margin-top:6px">คัดลอกข้อความแจ้งผู้ปกครอง</button>':'')+(ROOMONLY&&rs.some(r=>r.due>0)?'<button class="btn ghost claimb" style="width:100%;margin-top:6px">แจ้งชำระแทนผู้ปกครอง (แนบหลักฐาน)</button>':'')+'<button class="btn" style="width:100%;margin-top:6px" onclick="dlg.close()">ปิด</button>';
  if(!$("dlg").open)$("dlg").showModal();loadHistory(id)}
function payForm(id,y,t){
  const r=ROWS.find(x=>x.id===id&&x.year===y&&x.term===t);
  const fld=(k,label,due)=>due>0?`<label class="fld"><span>${label} (ค้าง ${fmt(due)} บาท)</span><input id="p_${k}" type="number" inputmode="decimal" min="0" max="${due}" step="any" value="${due}"></label>
  <label class="fld"><span>เลขที่ใบเสร็จ${label}</span><input id="pr_${k}" autocomplete="off"></label>`:"";
  $("dlg").innerHTML=`<h2 style="margin:0">บันทึกการชำระ</h2><span class="hint">${esc(r.name)} · ปี ${esc(y)} ภาคเรียนที่ ${esc(t)} · ค้างรวม ${fmt(r.due)} บาท</span>
  <form id="pf" style="margin-top:14px">${fld("edu","บำรุงการศึกษา",r.dueEdu)}${fld("assoc","บำรุงสมาคม",r.dueAssoc)}
  <label class="fld"><span>หมายเหตุ (ถ้ามี)</span><input id="pn"></label>
  <p class="hint" style="margin:0">จ่ายบางส่วนได้ ใส่เฉพาะจำนวนที่รับมา ส่วนที่เหลือยังค้างอยู่</p>
  <p class="err" id="pe" role="alert"></p>
  <div style="display:flex;gap:10px"><button type="button" class="btn ghost" id="pc" style="flex:1">ยกเลิก</button><button class="btn" style="flex:1">บันทึก</button></div></form>`;
  $("pc").onclick=()=>detail(id);
  $("pf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector(".btn:not(.ghost)"),v=k=>$("p_"+k)?+$("p_"+k).value||0:0,rv=k=>$("pr_"+k)?$("pr_"+k).value.trim():"";
   if(v("edu")+v("assoc")<=0){$("pe").textContent="กรอกจำนวนเงินอย่างน้อย 1 รายการ";return}
   if((v("edu")>0&&!rv("edu"))||(v("assoc")>0&&!rv("assoc"))){$("pe").textContent="กรอกเลขที่ใบเสร็จให้ครบทุกรายการที่รับเงิน";return}
   b.disabled=true;b.textContent="กำลังบันทึก...";
   const res=await api({action:"pay",code:STAFFPW,id,year:y,term:t,edu:v("edu"),assoc:v("assoc"),receiptEdu:rv("edu"),receiptAssoc:rv("assoc"),note:$("pn").value.trim()});
   if(!res.ok){$("pe").textContent=res.error;b.disabled=false;b.textContent="บันทึก";return}
   ROWS=ROWS.filter(x=>x.id!==id).concat(res.rows);render();detail(id,"บันทึกแล้ว ยอดค้างอัปเดตเรียบร้อย")}}
function open_(e){const it=e.target.closest(".item");if(!it)return;if(e.type=="keydown"&&e.key!="Enter")return;detail(it.dataset.id)}
$("dlg").addEventListener("click",async e=>{const id=$("dlg").dataset.id,b=e.target.closest(".pay");if(b)return payForm(id,b.dataset.y,b.dataset.t);
  if(e.target.closest(".msgs"))return showMsg("ข้อความแจ้งผู้ปกครอง",studentMsg(id),"ส่งให้ผู้ปกครองรายบุคคลเท่านั้น ตรวจข้อความก่อนส่ง แก้ไขในช่องได้",id);
  if(e.target.closest(".claimb"))return claimForm(id,"staff");
  const cx=e.target.closest(".cx");
  if(cx){const reason=(prompt("เหตุผลที่ยกเลิกรายการนี้ (จำเป็นต้องกรอก)")||"").trim();if(!reason)return;if(!confirm("ยกเลิกรายการรับเงินนี้ ยอดจะถูกหักคืน ใช่ไหม"))return;
    cx.disabled=true;const res=await api({action:"cancelPayment",code:STAFFPW,n:+cx.dataset.n,reason});
    if(!res.ok){cx.disabled=false;alert(res.error);return}
    ROWS=ROWS.filter(r=>r.id!==id).concat(res.rows);render();detail(id,"ยกเลิกรายการแล้ว ยอดค้างอัปเดตเรียบร้อย")}});
$("list").addEventListener("click",open_);$("list").addEventListener("keydown",open_);
$("exp").onclick=()=>{const f=groups.filter(g=>g.due>0);
  const csv="\uFEFFรหัส,ชื่อ-สกุล,ชั้น,ค้างชำระ\n"+f.map(g=>[g.id,'"'+g.name+'"',g.cls,g.due].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ค้างชำระ.csv";a.click()};
</script>
